name: Verify production site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-site
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify live public routes and capture production screenshots
        run: bun run check:browser --production --channel chrome --concurrency 1
      - name: Retain production browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-browser-screenshots
          path: results/visual-*
          retention-days: 7
          if-no-files-found: error
