name: Verify production site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-site
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Provision pinned Playwright Chromium
        run: |
          set -euo pipefail
          sudo python3 scripts/browser_acquisition.py
          config=/etc/apt/apt.conf.d/99-browser-acquisition
          sudo test ! -e "$config"
          sudo test ! -L "$config"
          trap 'sudo rm -f "$config"' EXIT
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "1";' | sudo tee "$config" >/dev/null
          bunx --no-install playwright install --with-deps chromium
      - name: Verify live public routes and capture production screenshots
        run: bun run check:browser --production --concurrency 1
      - name: Retain production browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-browser-screenshots
          path: results/visual-*
          retention-days: 7
          if-no-files-found: error
