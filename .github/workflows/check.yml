name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run cloudflare:dry-run
      - name: Run the documented first check
        run: bun run try
      - run: bun x --no-install playwright install --with-deps chromium
      - run: bun run check:browser
      - name: Retain the validated static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-site
          path: site/dist
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-screenshots
          path: results/visual-*
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: Required
    if: always()
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          CHECK: ${{ needs.check.result }}
        run: |
          set -euo pipefail
          if [[ "$CHECK" != success ]]; then
            printf 'Unexpected required job result: %s\n' "$CHECK"
            exit 1
          fi
