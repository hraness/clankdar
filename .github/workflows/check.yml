name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests cancel superseded runs; every main push keeps its own run.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Typecheck, Workers, and exports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run typecheck:cloudflare
      # Workers tests and the dry run read cloudflare/assets, which the site build creates.
      - run: bun run build:site
      - run: bun run test:cloudflare
      - name: Validate public benchmark export
        run: |
          python3 hf/stage.py
          python3 -m unittest discover -s hf -p 'test_*.py'
      - run: bun run cloudflare:dry-run
      - name: Run the documented first check
        run: bun run try

  unit:
    name: Bun tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test

  browser:
    name: Browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:site
      # The runner image ships Google Chrome; no Playwright browser download.
      - run: bun run check:browser --channel chrome
      - name: Retain the validated static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-site
          path: site/dist
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-screenshots
          path: results/visual-*
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: Required
    if: always()
    needs: [static, unit, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          for result in "$STATIC" "$UNIT" "$BROWSER"; do
            if [[ "$result" != success ]]; then
              printf 'Unexpected required job result: %s\n' "$result"
              exit 1
            fi
          done
